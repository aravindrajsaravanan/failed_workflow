
name: GitHub Workflow Reader

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  read-workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Read GitHub workflow runs
        run: python github_reader.py
